modalities:
  - h-and-e

claude:
  summary: |
    CellViT (Hörst et al., Med Image Anal 2024) keeps HoVer-Net's three-decoder
    head but replaces the CNN encoder with a SAM/DINOv2-pretrained ViT. State
    of the art on PanNuke at release; standard open-source ViT-based cell
    segmentation baseline.
  use_when:
    - "Nuclei segmentation + classification on H&E with a modern ViT backbone"
    - "Comparing ViT-based vs CNN-based cell models on PanNuke"
    - "When SAM / DINOv2 weights are preferred over ImageNet supervised"
  do_not_use_when:
    - "Need an extremely lightweight model — ViT is heavier than HoVer-Net"
    - "Need cell-state / mitosis-specific labels — use MIDOG-trained detectors"
    - "Need IHC / IF — H&E only"
  update_level: link_update
  update_status: complete
  extraction_confidence: high
  metadata_confidence: high
