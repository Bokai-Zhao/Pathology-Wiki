id: cellvit
type: method
name: CellViT — Vision Transformers for Precise Cell Segmentation and Classification

stage:
  - deep_wsi_learning

parent_methods: []
child_methods: []
predecessors:
  - hover-net
successors: []

core_idea: |
  Combine a SAM-pretrained (or DINOv2-pretrained) Vision Transformer backbone
  with a HoVer-Net-style three-decoder head (nuclear pixel + HV distance map +
  nuclear type). The ViT encoder provides richer, less stain-sensitive features
  than the original HoVer-Net CNN backbone, particularly when initialised from
  large-scale natural-image SSL (SAM, DINOv2). The decoder structure preserves
  HoVer-Net's instance-separation trick. CellViT outperforms HoVer-Net on
  PanNuke and is currently a strong open-source baseline for H&E cell
  segmentation + classification.

key_questions:
  - "SAM vs DINOv2 vs UNI as the ViT backbone?"
  - "How much does the HV head still matter when the backbone is much stronger?"
  - "Inference speed vs HoVer-Net — ViT adds compute but reduces post-processing"
  - "Domain shift: does the ViT backbone generalise better across tissues than HoVer-Net?"

