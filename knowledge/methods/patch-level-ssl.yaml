claude:
  summary: |
    Umbrella sub-branch of pathology_foundation_model covering all patch-level
    self-supervised pretraining recipes — CTransPath (MoCo v3 + SRCL),
    Phikon (iBOT), Lunit-DINO (DINO), UNI (DINOv2), Virchow (DINOv2),
    H-Optimus, PathDINO. All share a patch-in, embedding-out interface and
    are used as frozen feature extractors for downstream MIL.
  use_when:
    - "Discussing pathology SSL pretraining recipes"
    - "Comparing patch-level encoders for downstream MIL"
    - "Positioning a new patch SSL method in the PFM landscape"
  do_not_use_when:
    - "User wants slide-level pretraining (GigaPath) — link to a different sub-branch"
    - "User wants vision-language alignment (CONCH / MUSK / PLIP)"
  update_level: taxonomy_update
  update_status: complete
  extraction_confidence: high
  metadata_confidence: high
