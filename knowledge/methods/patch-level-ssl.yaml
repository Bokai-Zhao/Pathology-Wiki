id: patch-level-ssl
type: method
name: Patch-Level Self-Supervised Learning (Pathology)

stage:
  - pathology_foundation_model

parent_methods:
  - pathology-foundation-model
child_methods: []
predecessors: []
successors: []

core_idea: |
  Pretrain a patch-level visual encoder on millions of pathology image patches
  using self-supervised objectives — contrastive (MoCo, SimCLR), masked image
  modelling (MAE, MIM), or self-distillation (DINO, DINOv2) — *without* slide-
  level or pixel-level labels. The result is a general-purpose patch encoder
  that downstream slide-level pipelines (MIL aggregators, retrieval, anomaly
  detection) use as a frozen backbone. Patch-level SSL is the dominant
  pretraining strategy for modern pathology foundation models (CTransPath,
  Phikon, Lunit-DINO, UNI, Virchow, H-Optimus).

key_questions:
  - "Which SSL objective transfers best to pathology — contrastive vs DINO vs MIM?"
  - "How much pretraining data is enough — TCGA-only vs multi-cohort millions?"
  - "What patch size / magnification mix maximises downstream utility?"
  - "How do gains scale with model size and pretraining compute?"
  - "How do patch-level SSL encoders compare against slide-level pretraining (GigaPath)?"

representative_articles:
