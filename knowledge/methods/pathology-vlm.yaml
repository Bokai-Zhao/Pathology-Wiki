id: pathology-vlm
type: method
name: Pathology Vision-Language Models

stage:
  - pathology_vlm

parent_methods: []
child_methods: []
predecessors:
  - patch-level-ssl
successors: []

core_idea: |
  Align pathology image features with text descriptions (captions, reports,
  textbook excerpts) via large-scale image-text contrastive pretraining
  (CLIP-style) or generative alignment (caption / report generation), to
  enable zero-shot classification, retrieval, and natural-language querying
  of histopathology images. The text encoder serves as a flexible classifier
  whose label set can change at inference time, sidestepping per-task
  fine-tuning. Pathology VLMs are the foundational technology under modern
  pathology MLLMs (PathChat, PathGen, MUSK) and zero-shot WSI pipelines
  (MI-Zero, CONCH-MIL).

key_questions:
  - "Where does the text supervision come from — captions, reports, Twitter, textbooks?"
  - "Image-text contrastive (CLIP) vs generative captioning vs instruction-tuned MLLM?"
  - "How does zero-shot accuracy compare against frozen-feature linear probing?"
  - "How to extend patch-level VL alignment to slide-level (MI-Zero, CONCH-MIL)?"
  - "What text vocabulary covers diagnostic pathology adequately?"

representative_articles:
