claude:
  summary: |
    Umbrella method node for pathology vision-language models. Subbranches:
    image-text contrastive (CLIP-style — PLIP / CONCH / QuiltNet), report
    alignment, histology captioning, pathology VQA, retrieval-augmented
    reasoning, instruction-tuned pathology MLLM (PathChat, MUSK). MI-Zero
    extends image-text VL alignment from patch to slide via MIL aggregation
    on top of VL features.
  use_when:
    - "Discussing zero-shot classification on H&E"
    - "Positioning a new pathology VL method in the D branch of the method map"
    - "Comparing pathology VLMs (PLIP / CONCH / MUSK / QuiltNet)"
    - "Designing a pathology retrieval or captioning pipeline"
  do_not_use_when:
    - "User wants vision-only PFM features for MIL — link to patch-level-ssl instead"
    - "User wants slide-level pretraining (GigaPath) — different sub-branch"
  update_level: taxonomy_update
  update_status: complete
  extraction_confidence: high
  metadata_confidence: high
