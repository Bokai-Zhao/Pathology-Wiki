core_idea: |
  Pretrain a large image (or image+text/omics) encoder on millions of pathology
  patches/slides using self-supervised or contrastive objectives, then transfer
  to many downstream tasks via frozen features or lightweight heads. The aim
  is general-purpose representations whose value scales with pretraining data
  and parameters, analogous to ImageNet-era backbones but pathology-specific.

key_questions:
  - "Patch-level vs slide-level pretraining objectives?"
  - "Vision-only vs vision-language vs vision-omics?"
  - "How does pretraining scale (data, params, magnification) translate to clinical utility?"
  - "What evaluation suite captures generality without overfitting to TCGA-like distributions?"

