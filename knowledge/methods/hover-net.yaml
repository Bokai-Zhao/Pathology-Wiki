claude:
  summary: |
    HoVer-Net (Graham et al., Med Image Anal 2019) is the canonical CNN
    architecture for joint nuclei segmentation + classification in H&E. Three
    decoders (NP, HV, NT) with watershed-style instance separation. Standard
    baseline against which CellViT, StarDist, and follow-ups are compared on
    PanNuke / CoNSeP / MoNuSAC.
  use_when:
    - "Nuclei instance segmentation + classification baseline on H&E"
    - "Educational reference for the HV-decoder instance-separation trick"
    - "Comparing modern ViT cell methods (CellViT) against the canonical CNN baseline"
  do_not_use_when:
    - "Need raw patch features for downstream MIL — use a PFM"
    - "Need IHC / IF stains — HoVer-Net is H&E"
    - "Need real-time inference at WSI scale — modern lightweight alternatives may be faster"
  update_level: link_update
  update_status: complete
  extraction_confidence: high
  metadata_confidence: high
