id: hover-net
type: method
name: HoVer-Net — Joint Nuclei Instance Segmentation and Classification

stage:
  - traditional_cpath
  - deep_wsi_learning

parent_methods: []
child_methods: []
predecessors: []
successors:
  - cellvit

core_idea: |
  CNN with three decoders applied to H&E patches: (1) nuclear pixel (NP)
  decoder producing a binary nuclei mask, (2) horizontal-vertical (HV) distance
  map decoder predicting per-pixel distance from each nucleus centre, used to
  split touching nuclei via watershed-style instance separation, and (3)
  nuclear type (NT) decoder producing a per-nucleus class label. Together they
  solve nuclei instance segmentation and classification in one forward pass.
  HoVer-Net is the canonical baseline for nuclei tasks in H&E pathology.

key_questions:
  - "How much does the HV-map separation help vs simple connected components?"
  - "Trade-off between encoder depth and inference speed at WSI scale?"
  - "How well do HoVer-Net weights trained on one tissue transfer to another?"

