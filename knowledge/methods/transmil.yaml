id: transmil
type: method
name: TransMIL — Transformer-based Correlated Multiple Instance Learning

stage:
  - deep_wsi_learning

parent_methods:
  - weakly-supervised-mil
child_methods: []
predecessors:
  - abmil
  - clam
successors: []

core_idea: |
  Replace ABMIL's MLP-attention aggregator with a Transformer encoder that
  models instance-instance correlations. Two ingredients: (1) a Nyström-based
  attention approximation to make self-attention feasible on bags of
  thousands of patches; (2) a Pyramid Position Encoding Generator (PPEG) to
  re-inject 2-D spatial context into the sequence. The result captures
  correlations between distant patches that mean / attention pooling cannot.

key_questions:
  - "Does Nyström approximation hurt quality vs exact attention on small bags?"
  - "Does spatial positional encoding actually help or is the random-2D mix sufficient?"
  - "How many layers / heads are necessary?"

