claude:
  summary: |
    TransMIL (Shao et al., NeurIPS 2021) brings Transformer self-attention to
    WSI MIL with Nyström approximation + PPEG positional encoding. Standard
    third baseline alongside ABMIL and CLAM in any modern WSI classification
    benchmark.
  use_when:
    - "WSI classification where instance-instance correlations are likely informative"
    - "Multi-class subtyping with large bags (Nyström gives compute headroom)"
    - "Survival prediction where context across distant patches matters"
  do_not_use_when:
    - "Small bag size — CLAM or ABMIL are simpler and adequate"
    - "Compute-bound deployment — Transformer adds parameters"
