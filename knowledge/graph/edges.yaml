edges:
  # UNI paper releases the UNI model
  - { from: uni-2024, to: uni, type: releases_model,
      evidence: "UNI paper (Chen et al. 2024) ships ViT-L/16 weights via Hugging Face MahmoodLab/UNI",
      confidence: high }

  # UNI is a vision-only pathology foundation model
  - { from: uni, to: pathology-foundation-model, type: belongs_to,
      evidence: "vision-only PFM branch of method_map.yaml",
      confidence: high }

  - { from: uni-2024, to: pathology-foundation-model, type: proposes_method,
      evidence: "paper's primary contribution is a pathology foundation model",
      confidence: high }

  # PANDA preprocessing typically uses OpenSlide
  - { from: panda, to: openslide, type: related_to,
      evidence: "PANDA WSIs are TIFF-based; OpenSlide is the canonical reader",
      confidence: medium }

  # Future edges deferred until referenced nodes exist (see report Pending References):
  #   uni-2024 --uses_dataset--> mass-100k
  #   uni --uses_dataset--> mass-100k
  #   panda --used_by_articles--> bulten-2022-panda
  #   panda --used_by_benchmark--> wsi-pfm-benchmark
  #   uni --supersedes? UNI2 (uni2 not yet ingested)

  # ---- Cluster 1: WSI public datasets (added 2026-05-19) ----
  # Datasets share OpenSlide as the canonical WSI reader
  - { from: camelyon16, to: openslide, type: related_to,
      evidence: "Camelyon16 .tif WSIs are typically read with OpenSlide", confidence: high }
  - { from: bach, to: openslide, type: related_to,
      evidence: "BACH Part B WSIs (.svs) read with OpenSlide", confidence: medium }
  - { from: midog, to: openslide, type: related_to,
      evidence: "MIDOG .tif WSIs read with OpenSlide", confidence: high }

  # Datasets used by the foundation-model evaluation track
  - { from: pathology-foundation-model, to: camelyon16, type: related_to,
      evidence: "Camelyon16 is a standard downstream benchmark for pathology PFMs (UNI, GigaPath, Virchow all evaluate on it)", confidence: high }
  - { from: pathology-foundation-model, to: pannuke, type: related_to,
      evidence: "PanNuke nuclei classification commonly used to test PFM patch-level features", confidence: medium }

  # PANDA grouped with Camelyon16 as the seed grading / classification benchmarks
  - { from: panda, to: camelyon16, type: related_to,
      evidence: "PANDA (grading) and Camelyon16 (detection) jointly anchor the canonical WSI weakly-supervised benchmark suite", confidence: medium }

  # GlaS (glands) and PanNuke (nuclei) are the morphometric segmentation pair
  - { from: glas, to: pannuke, type: related_to,
      evidence: "GlaS (gland-level) and PanNuke (cell-level) are the standard pair of small-scale H&E segmentation benchmarks", confidence: high }

  # ---- Cluster 2: Weakly-supervised MIL — articles propose methods, methods evaluated on datasets (added 2026-05-19) ----

  # Method hierarchy
  - { from: abmil, to: weakly-supervised-mil, type: belongs_to,
      evidence: "ABMIL is the canonical attention-based MIL variant; weakly-supervised-mil is the parent method node", confidence: high }
  - { from: clam, to: abmil, type: extends,
      evidence: "CLAM extends ABMIL with per-class attention branches + instance-clustering loss", confidence: high }
  - { from: clam, to: weakly-supervised-mil, type: belongs_to,
      evidence: "CLAM is a weakly-supervised MIL variant", confidence: high }
  - { from: transmil, to: weakly-supervised-mil, type: belongs_to,
      evidence: "TransMIL is a Transformer-based weakly-supervised MIL variant", confidence: high }
  - { from: transmil, to: abmil, type: extends,
      evidence: "TransMIL replaces ABMIL's MLP attention with Nyström self-attention + PPEG positional encoding", confidence: high }

  # Articles propose methods
  - { from: abmil-2018, to: abmil, type: proposes_method,
      evidence: "Ilse, Tomczak, Welling ICML 2018 — introduces the attention-MIL formulation", confidence: high }
  - { from: clam-2021, to: clam, type: proposes_method,
      evidence: "Lu et al. Nat Biomed Eng 2021 — introduces CLAM-SB / CLAM-MB", confidence: high }
  - { from: transmil-2021, to: transmil, type: proposes_method,
      evidence: "Shao et al. NeurIPS 2021 — introduces TransMIL", confidence: high }
  - { from: campanella-2019, to: weakly-supervised-mil, type: proposes_method,
      evidence: "Campanella et al. Nat Med 2019 — first clinical-grade application of weakly-supervised MIL (CNN + RNN aggregator) on ~44k MSKCC slides", confidence: high }

  # Method-method comparison / lineage among the articles
  - { from: clam-2021, to: abmil-2018, type: extends,
      evidence: "CLAM paper explicitly extends Ilse 2018 attention pooling", confidence: high }
  - { from: transmil-2021, to: abmil-2018, type: extends,
      evidence: "TransMIL benchmarks against ABMIL; replaces MLP attention with Transformer self-attention", confidence: high }
  - { from: transmil-2021, to: clam-2021, type: compares_with,
      evidence: "TransMIL reports comparisons against CLAM on Camelyon16 and TCGA cohorts", confidence: high }

  # Articles use datasets
  - { from: abmil-2018, to: camelyon16, type: uses_dataset,
      evidence: "ABMIL paper evaluates on the Camelyon16 lymph-node metastasis benchmark", confidence: high }
  - { from: clam-2021, to: camelyon16, type: uses_dataset,
      evidence: "CLAM paper evaluates on Camelyon16 in addition to renal/lung subtyping", confidence: high }
  - { from: transmil-2021, to: camelyon16, type: uses_dataset,
      evidence: "TransMIL paper evaluates on Camelyon16 + TCGA-NSCLC + TCGA-RCC", confidence: high }
  - { from: campanella-2019, to: camelyon16, type: related_to,
      evidence: "Campanella 2019 is the clinical-grade scale predecessor whose triage methodology informs Camelyon16-style benchmarks (no direct use of Camelyon16 cohort)", confidence: medium }

  # CLAM toolkit is the de-facto MIL head on top of PFMs
  - { from: clam, to: pathology-foundation-model, type: related_to,
      evidence: "CLAM is the default MIL aggregator on top of UNI / GigaPath / Virchow PFM features in modern WSI benchmarks", confidence: high }

  # PANDA's MIL method hints now resolve
  - { from: panda, to: clam, type: related_to,
      evidence: "CLAM is a canonical MIL aggregator used in PANDA Gleason-grading pipelines", confidence: medium }
  - { from: panda, to: abmil, type: related_to,
      evidence: "ABMIL is a canonical MIL aggregator used in PANDA Gleason-grading pipelines", confidence: medium }
  - { from: panda, to: weakly-supervised-mil, type: related_to,
      evidence: "PANDA Gleason grading is a standard weakly-supervised MIL target", confidence: high }

  # weakly-supervised-mil → pathology-foundation-model is the historical succession edge
  - { from: weakly-supervised-mil, to: pathology-foundation-model, type: related_to,
      evidence: "Pathology foundation models build on the MIL paradigm — typical pipeline is PFM patch features fed into a MIL aggregator", confidence: high }

  # ---- Cluster 3: cell/tissue baselines + PFM SSL (added 2026-05-19) ----

  # Method hierarchy
  - { from: patch-level-ssl, to: pathology-foundation-model, type: belongs_to,
      evidence: "Patch-level SSL is the dominant pretraining sub-branch of pathology foundation models", confidence: high }
  - { from: cellvit, to: hover-net, type: extends,
      evidence: "CellViT keeps HoVer-Net's three-decoder head (NP+HV+NT) and replaces the CNN encoder with a SAM-pretrained ViT", confidence: high }

  # Articles propose methods / release models
  - { from: hover-net-2019, to: hover-net, type: proposes_method,
      evidence: "Graham et al. Med Image Anal 2019 — introduces the HV-decoder three-branch CNN", confidence: high }
  - { from: cellvit-2024, to: cellvit, type: proposes_method,
      evidence: "Hörst et al. Med Image Anal 2024 — introduces CellViT (SAM-pretrained ViT + HoVer-Net decoder)", confidence: high }
  - { from: cellvit-2024, to: hover-net-2019, type: extends,
      evidence: "CellViT explicitly extends HoVer-Net's decoder head with a stronger ViT encoder", confidence: high }
  - { from: ctranspath-2022, to: ctranspath, type: releases_model,
      evidence: "Wang et al. Med Image Anal 2022 — releases the CTransPath checkpoint", confidence: high }
  - { from: ctranspath-2022, to: patch-level-ssl, type: proposes_method,
      evidence: "CTransPath is a patch-level SSL pretraining recipe (SRCL on Swin-T) for pathology", confidence: high }

  # Articles use datasets
  - { from: hover-net-2019, to: pannuke, type: uses_dataset,
      evidence: "HoVer-Net benchmarks on PanNuke along with CoNSeP/Kumar/CPM", confidence: high }
  - { from: cellvit-2024, to: pannuke, type: uses_dataset,
      evidence: "CellViT primary benchmark is PanNuke", confidence: high }

  # Model + PFM relations
  - { from: ctranspath, to: pathology-foundation-model, type: belongs_to,
      evidence: "CTransPath is an early open-source pathology foundation model", confidence: high }
  - { from: ctranspath, to: patch-level-ssl, type: belongs_to,
      evidence: "CTransPath is trained with patch-level SSL (SRCL)", confidence: high }

  # PFM SSL hierarchy: UNI also fits under patch-level-ssl now that the node exists
  - { from: uni, to: patch-level-ssl, type: belongs_to,
      evidence: "UNI is a patch-level SSL pretrained model (DINOv2)", confidence: high }
  - { from: ctranspath, to: uni, type: related_to,
      evidence: "CTransPath is the pre-UNI open-source pathology SSL baseline; UNI supersedes it in most benchmarks", confidence: high }

  # Cross-cluster links
  - { from: pannuke, to: hover-net, type: related_to,
      evidence: "HoVer-Net is the canonical CNN baseline on PanNuke", confidence: high }
  - { from: pannuke, to: cellvit, type: related_to,
      evidence: "CellViT is the canonical ViT baseline on PanNuke", confidence: high }
  - { from: hover-net-2019, to: cellvit-2024, type: related_to,
      evidence: "HoVer-Net precedes and motivates CellViT; both share decoder structure", confidence: high }
