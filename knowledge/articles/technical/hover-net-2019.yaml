  pubmed: to_verify

abstract: |
  Introduces HoVer-Net, a single-stage CNN with three decoder branches for
  simultaneous nuclei instance segmentation and classification in H&E
  histology. The novel ingredient is the horizontal-vertical (HV) distance map
  decoder, whose predicted per-pixel distances to the nearest nucleus centre
  are used to split touching nuclei via a watershed-style post-processing.
  Demonstrated on multi-tissue datasets (CoNSeP, Kumar, CPM, PanNuke), HoVer-Net
  sets a strong baseline for joint nuclei segmentation + classification that
  remains the standard reference architecture for cell-level H&E analysis.
