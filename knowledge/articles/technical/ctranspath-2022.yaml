  pubmed: to_verify

abstract: |
  Pretrains a Swin Transformer Tiny on ~32k TCGA + PAIP whole-slide images
  (~15M H&E patches at 224×224) using SRCL — Semantically-Relevant Contrastive
  Learning, a MoCo v3 variant that augments the standard contrastive pair with
  semantically-related positives drawn from a learned memory bank. The
  resulting CTransPath checkpoint serves as a general-purpose pathology
  patch encoder for downstream classification, MIL, and retrieval. CTransPath
  was the strongest open-source pathology SSL baseline before the UNI /
  GigaPath / Virchow era and remains a widely-used reference encoder.
