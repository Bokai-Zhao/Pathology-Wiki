abstract: |
  MADELEINE is a slide-level pathology foundation model from Mahmood Lab that
  pretrains across multiple histology stains (H&E, IHC, special stains)
  jointly. Built on top of a CONCH-style patch encoder, MADELEINE applies
  contrastive learning across stain-paired slide embeddings, learning a
  representation that generalises across staining protocols and supports
  multi-stain downstream tasks (mIHC analysis, multistain biomarker
  prediction, stain-invariant retrieval). One of the first slide-level PFMs
  designed explicitly for multi-stain inputs rather than H&E only.
