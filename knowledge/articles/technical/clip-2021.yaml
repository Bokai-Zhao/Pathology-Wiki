abstract: |
  Introduces CLIP — Contrastive Language-Image Pretraining. Trains a joint
  image and text encoder on 400M (image, caption) pairs scraped from the web
  with a contrastive InfoNCE objective: images and matched captions become
  close in a shared embedding space, mismatched pairs distant. The resulting
  model enables zero-shot image classification: provide candidate class names
  as text prompts, encode them, encode the image, and assign the image to the
  closest text. CLIP underpins the entire modern pathology VL stack — PLIP,
  CONCH, QuiltNet, MI-Zero are CLIP-architecture or CLIP-initialised models
  fine-tuned on pathology data.
