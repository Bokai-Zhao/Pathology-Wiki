abstract: |
  TANGLE is a slide-level pathology foundation model that pretrains slide
  representations against paired transcriptomics (RNA-seq) data via
  contrastive learning. Each slide-transcriptome pair becomes a positive
  example in a CLIP-style objective, aligning slide embeddings with bulk
  transcriptomic profiles. Demonstrated on TCGA cohorts, TANGLE produces
  slide embeddings that perform strongly on biomarker prediction, mutation
  inference, and survival prediction without requiring matched
  transcriptomes at inference time. Establishes the precedent for
  transcriptomics-guided slide pretraining as an alternative to report-
  guided multimodal slide PFMs (TITAN, PRISM).
