    - attention-mechanism
    - instance-level-clustering
  model_architecture:
    - resnet-50-imagenet                 # default patch encoder in original release
    - attention-mlp
    - per-class-attention-branch
  training_strategy:
    - end-to-end-bag-level
    - auxiliary-instance-clustering-loss
  supervision_type:
    - weakly-supervised
  input_type:
    - h-and-e-patch-256x256
    - bag-of-patches
  output_type:
    - bag-level-label
    - attention-heatmap
  datasets:
    - camelyon16
  metrics:
    - auc
    - accuracy
  baselines:
    - abmil
    - mil-rnn
    - mean-pool-mil
  implementation: "PyTorch; modular pipeline (CLAM repo) covering tissue segmentation, patch extraction, feature extraction, MIL training, heatmap generation."
  reproducibility: "Code and pretrained models public on github.com/mahmoodlab/CLAM; reproduction requires user-supplied WSIs (TCGA/CPTAC for renal & lung)."
  limitations:
    - "Default ResNet-50 ImageNet features are now superseded by pathology PFMs (UNI / GigaPath / Virchow)."
    - "Permutation-invariant attention — ignores spatial structure."
    - "Instance-clustering loss uses pseudo-labels that can be noisy in tumor-rich slides."
  reusable_components:
    - clam-sb-aggregator
    - clam-mb-aggregator
    - tissue-segmentation-pipeline
    - heatmap-visualisation-toolkit

claude:
  summary: |
    Lu, Williamson, Chen et al. (Nat Biomed Eng 2021) — CLAM is the standard
    weakly-supervised MIL framework on WSIs, distributed via the most widely
    used pathology MIL repo (mahmoodlab/CLAM). Default MIL head on top of
    UNI / GigaPath / Virchow in modern PFM evaluation pipelines.
  use_when:
    - "Building any modern WSI multi-class slide-level baseline"
    - "Need an open-source, well-maintained MIL toolkit"
    - "Data-limited settings where instance clustering helps"
    - "Reproducing 2021–2025 PFM evaluation results"
  do_not_use_when:
    - "Need explicit instance-instance correlation modelling — TransMIL / DSMIL"
    - "Need slide-level pretraining of the encoder — GigaPath"
    - "Need pixel-level supervision — fully-supervised segmentation"
  update_level: link_update
  update_status: complete
  extraction_confidence: high
  metadata_confidence: high
