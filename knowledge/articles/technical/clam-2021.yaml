id: clam-2021
type: article

article_type:
  primary: technical_article

title: "Data-efficient and weakly supervised computational pathology on whole-slide images"
authors:
  - Ming Y. Lu
  - Drew F. K. Williamson
  - Tiffany Y. Chen
  - Richard J. Chen
  - Matteo Barbieri
  - Faisal Mahmood
year: 2021
venue: Nature Biomedical Engineering
publication_status: published

links:
  doi: 10.1038/s41551-020-00682-w
  paper: https://www.nature.com/articles/s41551-020-00682-w
  pdf: https://www.ncbi.nlm.nih.gov/pmc/articles/PMC8711640/    # open access via PMC
  github: https://github.com/mahmoodlab/CLAM
  pubmed: "33649564"

abstract: |
  Deep-learning methods for computational pathology require either manual
  annotation of gigapixel whole-slide images (WSIs) or large datasets of WSIs
  with slide-level labels, and typically suffer from poor domain adaptation and
  interpretability. CLAM (clustering-constrained-attention multiple-instance
  learning) is an interpretable weakly supervised method for data-efficient
  WSI processing that requires only slide-level labels. It uses attention-based
  learning to identify subregions of high diagnostic value and instance-level
  clustering over those representative regions to constrain and refine the
  feature space. Applied to subtyping of renal cell carcinoma and non-small-cell
  lung cancer and to lymph-node-metastasis detection, CLAM localises known
  morphological features without spatial labels, outperforms standard weakly
  supervised baselines, and generalises to independent test cohorts,
  smartphone microscopy and varying tissue content.
keywords:
  - multiple instance learning
  - attention mechanism
  - weakly-supervised learning
  - whole slide image
  - data efficiency
  - computational pathology

