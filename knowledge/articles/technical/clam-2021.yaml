id: clam-2021
type: article

article_type:
  primary: technical_article

title: "Data-efficient and weakly supervised computational pathology on whole-slide images"
authors:
  - Ming Y. Lu
  - Drew F. K. Williamson
  - Tiffany Y. Chen
  - Richard J. Chen
  - Matteo Barbieri
  - Faisal Mahmood
year: 2021
venue: Nature Biomedical Engineering
publication_status: published

links:
  doi: 10.1038/s41551-020-00682-w
  paper: https://www.nature.com/articles/s41551-020-00682-w
  github: https://github.com/mahmoodlab/CLAM
  pubmed: to_verify

abstract: |
  Introduces CLAM (Clustering-constrained Attention Multi-instance Learning),
  a data-efficient weakly-supervised MIL framework with two variants: CLAM-SB
  (single-branch attention with slide-level softmax) and CLAM-MB (one
  attention branch per class). Adds an instance-level clustering loss that
  uses the highest- and lowest-attended patches as positive / negative
  pseudo-labels for an auxiliary classifier, regularising attention and
  improving data efficiency. Demonstrated on renal cell carcinoma subtyping,
  non-small cell lung cancer subtyping, and lymph-node metastasis detection.
  The release ships training code, pretrained models, and slide-processing
  scripts that became the de-facto pathology MIL toolkit.
