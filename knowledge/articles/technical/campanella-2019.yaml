abstract: |
  Demonstrates the first clinical-grade application of weakly-supervised MIL
  to pathology at scale: ~44,732 WSIs across prostate core needle biopsies,
  basal cell carcinoma, and breast cancer metastasis to axillary lymph nodes,
  trained from slide-level diagnostic reports alone (no pixel or patch
  annotation). The MIL pipeline (CNN feature extractor + RNN-based bag
  aggregator) achieves AUCs > 0.98 across all three tasks. Defines a
  computer-assisted triage workflow that would have allowed pathologists to
  safely exclude 65–75% of slides as negative, demonstrating clinical-grade
  weak supervision is feasible.
