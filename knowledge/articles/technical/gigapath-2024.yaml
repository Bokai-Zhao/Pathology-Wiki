abstract: |
  Prov-GigaPath is the first published whole-slide foundation model for
  digital pathology. The authors curate Prov-Path, a real-world clinical
  cohort of ~171,189 whole-slide images and ~1.3 billion 256×256 patches
  from Providence health network. A two-stage pretraining pipeline first
  applies DINOv2 to a ViT-based patch encoder, then trains a slide-level
  Transformer (LongNet) on slide-level patch sequences via masked
  autoencoding. The released checkpoint outperforms prior pathology PFMs
  (UNI, Phikon, CTransPath) on 25 of 26 downstream tasks across pan-cancer
  classification, mutation prediction, biomarker prediction, and
  vision-language alignment.
