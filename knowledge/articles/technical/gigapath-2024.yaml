  summary: |
    Xu et al. (Nature 2024, 630:181–188) — Prov-GigaPath is the first
    published slide-level pathology foundation model. Two-stage pretraining
    on Providence's ~171k-WSI Prov-Path cohort: DINOv2 on patches, then
    LongNet masked autoencoding on slide-level patch sequences. Beats UNI /
    CTransPath / Phikon on 25/26 downstream tasks. Sister paper to UNI in
    the modern PFM cohort; the canonical reference for slide-level
    pretraining.
  use_when:
    - "Designing or comparing slide-level pretraining recipes"
    - "Choosing a strong slide-level encoder for downstream WSI tasks"
    - "Citing the precedent for two-stage patch-then-slide pretraining"
  do_not_use_when:
