abstract: |
  Virchow is a 632M-parameter ViT-H/14 patch-level pathology foundation
  model trained with DINOv2 on ~1.5 million WSIs and ~2 billion patches
  from Memorial Sloan Kettering Cancer Center — the largest published
  pathology pretraining cohort to date. Evaluated on 17 tissue / cancer
  types and 7 rare-cancer detection tasks, Virchow matches or beats
  prior PFMs (UNI, Prov-GigaPath, CTransPath) on most patch-level and
  slide-level downstream benchmarks. Particular emphasis on rare-cancer
  detection where pretraining-data scale dominates downstream gains.
  Released via Paige.AI under a research license on Hugging Face.
