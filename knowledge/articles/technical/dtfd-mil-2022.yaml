abstract: |
  DTFD-MIL (Double-Tier Feature Distillation MIL) addresses the small-bag-
  size problem in WSI classification by introducing pseudo-bags. Each WSI is
  partitioned into multiple smaller pseudo-bags, an inner-tier MIL aggregator
  produces per-pseudo-bag embeddings, and an outer-tier aggregator pools
  pseudo-bag embeddings into a slide-level prediction with a feature-
  distillation loss that aligns inner and outer features. The method
  outperforms ABMIL and CLAM on Camelyon16 and TCGA cohorts with very small
  numbers of training slides per class. DTFD-MIL is the canonical reference
  for pseudo-bag construction and MIL feature distillation.
