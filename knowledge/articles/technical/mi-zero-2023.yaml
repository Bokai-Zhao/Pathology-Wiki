  arxiv: "2306.07831"

abstract: |
  Introduces MI-Zero, a method to perform zero-shot slide-level classification
  on whole-slide images using a pathology vision-language model. Patch-level
  VL similarity scores (computed against text prompts) are aggregated via
  three pooling functions — top-k, weighted top-k, and identity — over the
  slide's patches to produce a slide-level zero-shot prediction without any
  slide-level training. MI-Zero uses a pre-existing pathology VL model
  (the authors release one alongside) and demonstrates competitive zero-shot
  performance on TCGA-NSCLC, TCGA-RCC, and TCGA-BRCA subtyping.
