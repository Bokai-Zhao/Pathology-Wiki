id: abmil-2018
type: article

article_type:
  primary: technical_article

title: "Attention-based Deep Multiple Instance Learning"
authors:
  - Maximilian Ilse
  - Jakub M. Tomczak
  - Max Welling
year: 2018
venue: ICML
publication_status: published

links:
  arxiv: "1802.04712"
  paper: https://proceedings.mlr.press/v80/ilse18a.html
  doi: 10.48550/arXiv.1802.04712       # to_verify (arxiv DOI, ICML proceedings has no separate DOI)
  github: https://github.com/AMLab-Amsterdam/AttentionDeepMIL

abstract: |
  Proposes a permutation-invariant attention mechanism for multiple instance
  learning. Each instance in a bag produces a scalar attention weight via a
  small two-layer MLP; the bag embedding is the attention-weighted sum of
  instance embeddings. Two variants: vanilla and gated attention. Demonstrated
  on synthetic MNIST bags and on histopathology (breast and colon cancer).
  Establishes attention pooling as the default learned MIL aggregator.
