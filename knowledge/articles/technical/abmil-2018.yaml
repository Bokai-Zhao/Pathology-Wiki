claude:
  summary: |
    Ilse, Tomczak, Welling (ICML 2018). The paper that introduced learned
    attention pooling to MIL and seeded the modern WSI MIL literature in
    pathology. ABMIL is the default first baseline for any new slide-level
    classification task; CLAM, TransMIL, DSMIL, DTFD-MIL all descend from it.
  use_when:
    - "Citing the origin of attention-based MIL for any pathology paper"
    - "Establishing the simplest learned-attention baseline"
    - "Teaching MIL aggregation fundamentals"
  do_not_use_when:
    - "Need spatial / sequence modelling — cite TransMIL"
    - "Need class-specific attention — cite CLAM-MB"
    - "Need explicit instance-instance correlations — cite DSMIL or TransMIL"
