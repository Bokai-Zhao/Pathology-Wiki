abstract: |
  DSMIL (Dual-Stream Multiple Instance Learning) introduces a two-stream
  MIL architecture for WSI classification. The first stream selects the
  highest-attention "critical instance" via a max-pooling operation; the
  second stream weights all instances against that critical instance via
  a non-local attention mechanism, producing a calibrated bag embedding.
  The method also introduces a self-supervised contrastive pretraining
  step (SimCLR-style) on patch features before MIL training, improving
  data efficiency on small cohorts. Evaluated on Camelyon16 and TCGA-NSCLC,
  DSMIL outperforms ABMIL and earlier MIL baselines.
