    plus SimCLR self-supervised pretraining of the patch encoder.
    Standard sibling reference to ABMIL / CLAM / TransMIL in the modern
    MIL benchmark suite. The non-local attention idea is a precedent
    for TransMIL's later Transformer self-attention.
