abstract: |
  Lunit-DINO benchmarks self-supervised learning recipes on pathology
  data, comparing DINO, SwAV, MoCo v2, BarlowTwins, and supervised
  ImageNet baselines on patch-level pathology classification across
  multiple H&E datasets. The paper releases the Lunit-DINO checkpoint —
  a ViT-S/16 trained with DINO on TCGA + TULIP — that for several years
  served as the strongest open-weights pathology SSL baseline alongside
  CTransPath. Lunit-DINO is one of the foundational papers establishing
  DINO as the canonical pretraining recipe for pathology PFMs (later
  scaled to UNI / Virchow / Prov-GigaPath via DINOv2).
