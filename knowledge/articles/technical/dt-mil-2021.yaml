abstract: |
  DT-MIL (Deformable Transformer MIL) introduces a deformable Transformer
  aggregator for WSI multiple instance learning. Where ABMIL and CLAM use
  scalar-attention pooling and TransMIL uses Nyström-approximated full
  self-attention, DT-MIL uses sparse deformable attention — each query
  attends to a small learnable subset of "key" patches rather than all
  patches in the bag. This reduces compute while preserving long-range
  context. DT-MIL evaluates on Camelyon16 and TCGA cohorts as a sibling
  reference to TransMIL.
