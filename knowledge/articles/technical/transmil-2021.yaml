  doi: to_verify

abstract: |
  Introduces TransMIL, a Transformer-based MIL aggregator that models
  correlations between patches in a WSI bag. Two components: (1) Nyström-based
  self-attention to scale to bags of thousands of patches, and (2) a Pyramid
  Position Encoding Generator (PPEG) that injects 2-D spatial context via a
  combination of multi-scale convolutions and learned positional embeddings.
  TransMIL outperforms permutation-invariant MIL baselines on Camelyon16,
  TCGA-NSCLC, and TCGA-RCC slide-level classification.
