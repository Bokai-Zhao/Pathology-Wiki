title: "A visual–language foundation model for pathology image analysis using medical Twitter"
authors:
  - Zhi Huang
  - Federico Bianchi
  - Mert Yuksekgonul
  - Thomas J. Montine
  - James Zou
year: 2023
venue: Nature Medicine
publication_status: published

links:
  doi: 10.1038/s41591-023-02504-3
  paper: https://www.nature.com/articles/s41591-023-02504-3
  github: https://github.com/PathologyFoundation/plip
  huggingface: https://huggingface.co/vinid/plip
  pubmed: to_verify

abstract: |
  Introduces PLIP, a pathology vision-language foundation model obtained by
  fine-tuning CLIP on OpenPath — a corpus of ~200k pathology image-caption
  pairs mined from medical Twitter (clinician posts using pathology-related
  hashtags). PLIP enables zero-shot pathology image classification, image-text
  retrieval, and similar-image search across multiple H&E benchmarks (Kather
  CRC, PanNuke crops, others). Demonstrated to outperform CLIP-ImageNet and
  to match or exceed supervised baselines on several zero-shot tasks. Also
  releases the OpenPath dataset, the first large-scale pathology image-caption
  corpus with open access.
