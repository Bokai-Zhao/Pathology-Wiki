abstract: |
  CONCH (CONtrastive learning from Captions for Histopathology) is a
  pathology vision-language foundation model from Mahmood Lab. Pretrained
  on ~1.17 million pathology image-caption pairs sourced from textbooks,
  educational presentations, and research publications, CONCH uses a
  CoCa-style contrastive + captioning dual objective with a ViT-B/16
  visual encoder. Evaluated on 14 downstream tasks spanning zero-shot
  classification, image-text retrieval, image-image retrieval,
  segmentation, and cross-modal cancer subtyping, CONCH consistently
  outperforms PLIP and prior pathology VL models. The successor to PLIP
  in the open-weights pathology VL cohort; superseded by CONCH v1.5
  (a later checkpoint released on Hugging Face).
