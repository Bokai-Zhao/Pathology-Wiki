abstract: |
  CHIEF (Clinical Histopathology Imaging Evaluation Foundation) is a
  pathology foundation model for cancer diagnosis and prognosis. Pretrained
  on a multi-cohort H&E corpus with a hybrid contrastive + clinical-text-
  aligned objective, CHIEF is evaluated across 19 independent cohorts
  spanning 32 cancer types, ~60,000 WSIs from 24 hospitals worldwide.
  Demonstrates strong diagnosis (AUC > 0.94 average) and survival prediction
  on rare and common cancers, plus generalisation to non-Tencent / non-MGH
  cohorts. Published alongside Prov-GigaPath in 2024 as a parallel
  clinical-grade-focused PFM benchmark.
