abstract: |
  TITAN is a multimodal whole-slide foundation model from Mahmood Lab that
  jointly pretrains a slide-level vision encoder with paired pathology reports
  and synthetic captions. Built on top of a CONCH/UNI-style patch encoder,
  TITAN uses contrastive learning to align slide embeddings with both clinical
  reports and large-language-model-generated narrative descriptions, producing
  a slide encoder that supports zero-shot slide-level classification, slide
  retrieval, and report generation. Evaluated across diverse downstream tasks
  including pan-cancer subtyping, biomarker prediction, survival, and rare
  cancer detection, TITAN matches or exceeds Prov-GigaPath / CHIEF / Virchow
  on most benchmarks while adding a vision-language interface absent from
  prior slide-level PFMs.
