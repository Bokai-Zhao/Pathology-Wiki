abstract: |
  PRISM is a multimodal generative foundation model for slide-level
  histopathology from Paige.AI, the same lab that released Virchow. PRISM
  pairs a Virchow-derived patch encoder with a slide-level Transformer and a
  generative text decoder that captions whole slides given paired pathology
  reports during pretraining. The model supports zero-shot slide-level
  classification, slide retrieval, and slide-level report generation across
  internal MSKCC cohorts. PRISM is the first slide-level pathology PFM with
  an explicit generative captioning head.
