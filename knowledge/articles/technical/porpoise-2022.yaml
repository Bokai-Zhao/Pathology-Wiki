abstract: |
  PORPOISE (Pan-cancer Integrative Multimodal Prognosis) is a pan-cancer
  histology-genomic deep learning framework from Mahmood Lab. PORPOISE fuses
  slide-level features from WSIs with molecular features from bulk RNA-seq /
  mutations / copy-number-variation across 14 cancer types and ~5,720
  TCGA patients, producing a unified prognosis predictor that beats
  histology-only and genomics-only baselines on overall survival and
  disease-free survival. The framework also enables interpretable prognosis
  by attributing risk to specific morphological / molecular features, and
  is one of the most widely cited multimodal pathology AI papers from the
  pre-PFM era.
