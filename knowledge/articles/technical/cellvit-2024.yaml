abstract: |
  Replaces HoVer-Net's CNN encoder with a Vision Transformer (ViT) pretrained
  on natural images via SAM (Segment Anything) or via the DINOv2 recipe, while
  keeping HoVer-Net's three-decoder head (nuclear pixel + horizontal-vertical
  distance map + nuclear type). The richer ViT features substantially improve
  PanNuke nuclei segmentation and classification performance over HoVer-Net
  and StarDist. Released as an open-source implementation with two variants
  — CellViT-256 (SAM-pretrained ViT-B) and CellViT-SAM-H (SAM-pretrained
  ViT-H) — providing a strong modern open-source baseline for H&E cell
  analysis.
