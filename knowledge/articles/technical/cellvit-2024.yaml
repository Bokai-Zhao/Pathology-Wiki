    - "Heavy reliance on SAM pretraining — degraded performance reported when SAM weights are unavailable."
    - "PanNuke evaluation only — large-cohort cross-tissue generalisation less extensively validated than HoVer-Net's multi-dataset claim."
    - "Inference at WSI scale needs tiling and may run slower than CNN baselines."
