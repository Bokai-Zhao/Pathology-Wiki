abstract: |
  Phikon is a patch-level pathology foundation model from Owkin trained with
  iBOT (a masked image modelling SSL recipe combining DINO + MIM) on ~6,000
  TCGA WSIs (~43M H&E patches). Phikon was, alongside CTransPath, one of the
  strongest open-weights pathology SSL checkpoints in the pre-UNI era; it
  established iBOT as a competitive alternative to DINO/contrastive recipes
  for pathology pretraining. Released openly on Hugging Face under a research
  license, Phikon remains a widely-used open baseline. Phikon-v2 (2024)
  further scales the recipe to ~58k WSIs.
