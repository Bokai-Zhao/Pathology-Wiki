abstract: |
  MCAT (Multimodal Co-Attention Transformer) is one of the first widely-cited
  multimodal pathology AI architectures from Mahmood Lab, fusing WSI patch
  features with bulk genomic features (RNA-seq / mutations / CNV) via a
  cross-modal co-attention Transformer. Each modality attends to the other
  through learned co-attention layers, producing a joint representation used
  for survival prediction. Evaluated on TCGA cohorts spanning multiple cancer
  types, MCAT outperforms histology-only and genomics-only Cox baselines.
  MCAT establishes the precedent for cross-modal Transformer fusion in
  pathology and is the immediate predecessor of PORPOISE in the same lab's
  multimodal survival line.
