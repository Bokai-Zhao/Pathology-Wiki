abstract: |
  UNI is a self-supervised vision-only pathology foundation model trained with
  DINOv2 on Mass-100K, an internal corpus of ~100k WSIs (~100M H&E patches)
  spanning 20 tissue types. It targets general-purpose patch-level
  representations for downstream WSI tasks (classification, MIL aggregation,
  retrieval), evaluated across 33 tasks at slide and patch level.
