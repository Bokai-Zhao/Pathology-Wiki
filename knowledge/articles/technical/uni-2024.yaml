claude:
  summary: |
    UNI is a vision-only ViT-L pathology foundation model from Mahmood Lab,
    pretrained with DINOv2 on Mass-100K. It is the canonical baseline encoder
    for any new WSI-level benchmark covering H&E classification, MIL, or
    retrieval. UNI2 is a subsequent version — track via `supersedes` edges
    when added.
  use_when:
    - "Designing a WSI-level benchmark (use UNI as a strong vision-only baseline)."
    - "Comparing pathology PFMs (cite alongside CTransPath, GigaPath, Virchow, H-Optimus, CONCH)."
    - "Citing patch-level SSL on H&E."
  do_not_use_when:
    - "User wants a vision-language model — cite CONCH/MUSK instead."
    - "User wants slide-level pretraining specifically — cite GigaPath/Prov-GigaPath."
    - "User needs open pretraining data — Mass-100K is internal."
