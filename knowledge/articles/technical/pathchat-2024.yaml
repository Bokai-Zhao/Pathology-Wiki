abstract: |
  PathChat is a multimodal generative AI copilot for human pathology — an
  instruction-tuned large multimodal model (MLLM) that pairs a CONCH-derived
  pathology image encoder with a Llama-2 13B language model and is fine-
  tuned on ~456,000 pathology-specific instruction-response pairs. PathChat
  performs interactive Q&A, differential diagnosis, biomarker reasoning,
  and clinical-context grounding directly on H&E patches and morphology
  descriptions. In a multi-pathologist evaluation across cancer subtype
  reasoning, immunohistochemistry recommendations, and structured-report
  generation, PathChat outperforms LLaVA-Med and a generic GPT-4V baseline.
  The first conversational pathology copilot from a major research lab.
