    - clinical-triage

claude:
  summary: |
    Bahadir et al. (Nat Rev Electr Eng 2024) — a broad review of AI in
    histopathology covering ~206 references. Spans WSI preprocessing,
    deep-learning architectures (CNNs, MIL, transformers, GNNs), self-
    supervised pathology foundation models, vision-language pretraining,
    generative stain-norm / synthesis, segmentation, classification,
    biomarker/mutation/survival prediction, mitosis detection, and clinical
    translation. Written from the EE/ML community perspective. Cutoff
    ~mid-2023 — does not cover CONCH, QuiltNet, MUSK, GigaPath, Virchow,
    H-Optimus, PathChat. Use as a starting reference for any pathology AI
    survey or thesis introduction.
  use_when:
    - "Need a single broad reference for AI-in-histopathology background"
    - "Surveying classical → modern pipelines in computational pathology"
    - "Looking for entry-level positioning of MIL / PFM / VLM in a unified narrative"
    - "Thesis intro / grant proposal background section"
  do_not_use_when:
    - "Need 2024+ developments (CONCH / GigaPath / Virchow / H-Optimus / PathChat)"
    - "Need deep clinical regulatory / deployment guidance"
    - "Need a primary source — review article, not novel methodology"
    - "Need depth on multimodal path+omics+radiology — coverage is light"
  prefer_over:
