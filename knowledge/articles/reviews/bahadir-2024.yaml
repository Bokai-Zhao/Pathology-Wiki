  cohort_design: "Review — surveys retrospective cohorts (TCGA, MSKCC, multi-institution) cited per study."
  clinical_workflow: |
    Discusses computer-assisted triage (slide-level cancer detection),
    pathologist-AI collaboration, and integration with downstream molecular /
    treatment decisions. References Campanella 2019 as the canonical
    clinical-grade workflow example.
  clinical_need_for_ai: |
    Pathology workload bottleneck (rising case volumes, falling pathologist
    numbers), interobserver variability for grading and rare-cancer
    diagnosis, biomarker prediction from H&E sidestepping expensive
    molecular assays, prognosis stratification beyond manual grading.
  possible_ai_tasks:
