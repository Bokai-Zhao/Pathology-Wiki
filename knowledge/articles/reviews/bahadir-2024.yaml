clinical_focus:
  clinical_problem: |
    Surveys the spectrum of clinical pathology problems amenable to AI:
    tumor detection, grading (Gleason for prostate, ISUP, Nottingham for
    breast), subtype classification, biomarker prediction (HER2, IDH, MSI,
    TILs), molecular alteration inference, mitotic-count grading, survival /
    prognosis prediction, and treatment-response prediction.
