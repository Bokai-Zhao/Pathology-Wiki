abstract: |
  A broad review of artificial intelligence applications in histopathology,
  spanning whole-slide image acquisition and preprocessing, deep-learning
  architectures (CNNs, transformers, weakly-supervised MIL, graph neural
  networks), self-supervised learning and pathology foundation models, vision-
  language pretraining, generative models for stain normalisation and data
  augmentation, image registration, segmentation (gland and nuclei),
  classification, survival and biomarker prediction, mitosis detection, and
  clinical translation. The review covers ~206 references and is written from
  the perspective of the electrical-engineering and machine-learning community
  developing the underlying techniques. Authors include both computational
  (Sabuncu Lab at Cornell) and clinical (Weill Cornell pathology — Liechty,
  Pisapia) researchers.
