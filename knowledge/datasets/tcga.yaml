known_pitfalls:
  - "Multi-cohort, multi-scanner, multi-decade — colour and resolution drift across cohorts is large; stain normalisation matters."
  - "Frozen sections (-TS-*.svs) are diagnostically noisier than FFPE diagnostic slides (-DX-*.svs); most pathology benchmarks filter to FFPE only."
  - "Some cohorts have very few patients (e.g. CHOL n<60); per-cohort splits can overfit easily."
  - "Patient-level controlled-access fields (clinical metadata, patient IDs) require dbGaP approval — many MIL papers use TCGA WSIs only and de-identified labels."
  - "Same patient may have multiple slides — train/test splits MUST be patient-level, never slide-level."
  - "TCGA cohorts skew toward late-stage / surgical resection patients in academic centres — non-TCGA cohort generalisation is a known weak spot."
  - "Outcome labels (OS, DFS, PFS) are right-censored; survival modelling must use Cox / Kaplan-Meier-aware metrics, not classification metrics."
  - "RNA-seq and WSI cohorts overlap substantially but not perfectly — case-uuid matching is the canonical join."

claude:
  summary: |
    TCGA (The Cancer Genome Atlas) is the largest public multi-omics cancer
    cohort: ~30k WSIs across 33 cancer types, ~11k patients, paired with bulk
    RNA-seq, mutations, CNV, methylation, and clinical records. Almost every
    pathology AI paper from 2018 onward uses TCGA either for pretraining
    (CTransPath, Phikon, Lunit-DINO, Prov-GigaPath patch-level) or for
    downstream evaluation (CLAM, TransMIL, DSMIL, DTFD-MIL, MCAT, PORPOISE,
    TANGLE — all evaluate on TCGA cohorts). The canonical reference for any
    pathology AI experimental section.
  use_when:
    - "Pretraining a pathology foundation model (CTransPath / UNI / Virchow style)"
    - "Evaluating any WSI MIL / PFM method on standard pan-cancer / per-cancer subtyping"
    - "Multimodal histology-genomics studies (paired WSI + RNA-seq + mutations)"
    - "Pan-cancer survival prediction (PORPOISE, TANGLE, MCAT setups)"
    - "Cross-cohort generalisation studies — TCGA is the standard 'training' cohort vs non-TCGA institutional held-out"
  do_not_use_when:
    - "Need biopsy-level pathology — TCGA is mostly surgical resection + frozen sections, not core needle biopsies (use PANDA for that)"
    - "Need real-time clinical-grade test data — TCGA is retrospective and decade-old"
    - "Need patient-level controlled access fields — dbGaP approval required and process is slow"
    - "Need scanner / cohort consistency — TCGA spans many scanners and labs by design"
  preprocessing_notes:
    - "Filter to diagnostic FFPE slides (-DX-*.svs) for most benchmarks — frozen sections are noisier."
    - "Use case-uuid (TCGA barcode) for multi-omics alignment, not patient ID alone."
    - "Always patient-level train/test splits — never slide-level (one patient → multiple slides)."
    - "Stain normalisation across cohorts is recommended."
  known_pitfalls:
    - "Frozen vs FFPE noise differential."
    - "Small per-cohort sizes for rare cancers."
    - "Controlled-access clinical fields gated by dbGaP."
    - "Same-patient multi-slide leakage in naive splits."
  update_level: link_update
  update_status: complete
  extraction_confidence: high
  metadata_confidence: medium                # exact n_slides / n_patients vary by snapshot date
