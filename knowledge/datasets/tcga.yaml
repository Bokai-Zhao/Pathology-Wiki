scale:
  n_slides: 30000                            # ~30k WSIs across 33 cohorts (FFPE diagnostic + frozen) — to_verify exact
  n_patients: 11000                          # ~11k patients with WSI coverage — to_verify
  n_centers: to_verify                       # contributed by ~20+ centres across the US/EU
  file_size: "multi-TB"                      # raw .svs WSIs alone are >10 TB; full multi-omics archive substantially larger

access:
  public: true
  license: "TCGA data are released under NIH/NCI Genomic Data Commons access policy. WSIs (slide images) and most RNA-seq / mutation / CNV are open-access. Some clinical fields and patient-level identifiers require dbGaP controlled-access approval."
  download_difficulty: hard                  # multi-TB; multi-omics requires GDC client + dbGaP approval for restricted fields
  requires_registration: true                # NIH eRA Commons / dbGaP for controlled-access subsets
  access_url: https://portal.gdc.cancer.gov/

preprocessing:
  required_steps:
    - "Use NIH GDC Data Transfer Tool (`gdc-client`) for bulk download"
    - "Filter to diagnostic FFPE slides (`*-DX*.svs`) for most pathology benchmarks; frozen slides (`*-TS*.svs`) are noisier"
    - "Read .svs WSIs via OpenSlide (Aperio scanner format)"
    - "Match TCGA barcodes to align WSI ↔ RNA-seq ↔ clinical for multimodal studies"
    - "Per-cohort tissue segmentation + patch extraction (CLAM tissue-segmentation pipeline is standard)"
    - "Stain normalisation across cohorts is recommended (Macenko / Vahadane) — TCGA spans many scanners and labs"
  recommended_tools:
    - openslide
    - tcga-mil-pipeline                      # node pending — Liu et al. TCGA processing pipeline
    - clam                                   # CLAM repo includes TCGA-specific preprocessing scripts
    - gdc-client                             # NIH GDC bulk download CLI
  coordinate_system: "Native slide pixel space (Aperio .svs); barcodes are case-uuid for cross-modality alignment."
  file_formats:
    - svs                                    # WSI
    - tsv                                    # clinical / RNA-seq counts
    - vcf                                    # mutations
    - bigwig                                 # methylation / coverage tracks

