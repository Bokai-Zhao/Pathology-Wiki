scale:
  n_slides: 4500                                 # ~4.5k FFPE WSIs across 10 cohorts — to_verify exact
  n_patients: 2000                               # ~2k patients with WSI coverage — to_verify
  n_centers: to_verify                           # multi-institutional consortium contribution
  file_size: "multi-TB"                          # WSI archive alone is several TB

access:
  public: true
  license: "Most CPTAC data are open-access via NIH Proteomic Data Commons (PDC); some clinical fields require dbGaP controlled-access. Each cohort has a per-cohort access page at pdc.cancer.gov."
  download_difficulty: hard                      # PDC client + dbGaP for restricted fields; multi-cohort spread
  requires_registration: true                    # NIH eRA Commons / dbGaP for controlled-access
  access_url: https://pdc.cancer.gov/pdc/

preprocessing:
  required_steps:
    - "Use NIH PDC API or web portal to identify per-cohort manifests"
    - "Download WSIs per cohort — slides are FFPE diagnostic .svs (Aperio)"
    - "Read .svs WSIs via OpenSlide"
    - "Match CPTAC case-id (analogous to TCGA barcode) to align WSI ↔ proteomics ↔ clinical records"
    - "Per-cohort tissue segmentation + patch extraction (CLAM tissue-segmentation pipeline standard)"
    - "Stain normalisation across cohorts is recommended — CPTAC spans multiple scanners and labs like TCGA"
  recommended_tools:
    - openslide
    - clam
    - tcga-mil-pipeline                          # node pending — same pipeline transfers to CPTAC barcoded WSIs
  coordinate_system: "Native slide pixel space (Aperio .svs); CPTAC case-id is the canonical join key for cross-modality alignment."
  file_formats:
    - svs                                        # WSI
    - mzML / raw                                 # mass-spec proteomics
    - tsv                                        # processed proteomics + clinical
    - vcf                                        # mutations
    - bw                                         # methylation tracks (subset)

