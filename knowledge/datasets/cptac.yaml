related_articles: []

known_pitfalls:
  - "CPTAC is much smaller per cohort than TCGA (typically n<200 patients per cohort for proteomics-paired) — small-data regime; cross-cohort pretraining helps."
  - "Multi-cohort, multi-scanner like TCGA — colour and resolution drift across cohorts requires stain normalisation."
  - "Some cohorts have sparse WSI coverage relative to proteomics coverage — case-id matching MUST verify modality availability."
  - "Patient-level splits required (one patient → multiple slides possible)."
  - "Phase II / III / IV cohorts have different acquisition protocols — pooling across phases without careful harmonisation produces noise."
  - "Proteomics labels are continuous (mass-spec abundances) — cannot be directly used as classification labels without binning / thresholding."
  - "CPTAC is the canonical *external validation* cohort for TCGA-trained models — using it for both training and testing on the same paper defeats the cross-cohort purpose."

claude:
  summary: |
    CPTAC (Clinical Proteomic Tumor Analysis Consortium) is the NIH/NCI's
    proteomics-focused sister cohort to TCGA. ~4.5k FFPE WSIs, ~2k patients
    across 10 cancer cohorts, paired with mass-spectrometry proteomics
    (sometimes including phosphoproteomics) + RNA-seq + mutations + clinical
    records. The standard external validation cohort for TCGA-trained
    pathology models, and the only large public cohort with paired H&E +
    bulk proteomics for protein-from-histology research.
  use_when:
    - "External validation of a TCGA-trained pathology model — CPTAC is the canonical held-out cohort"
    - "Protein expression prediction from H&E (CPTAC has bulk proteomics that TCGA lacks)"
    - "Phosphoproteomics-aware pathology AI"
    - "Pan-cancer multimodal studies needing proteomics + WSI"
    - "Cross-cohort generalisation studies pairing TCGA + CPTAC"
  do_not_use_when:
    - "Need a large per-cancer cohort — TCGA is much larger per cohort"
    - "Need biopsy-level pathology — CPTAC is surgical-resection (use PANDA for biopsies)"
    - "Need fully open clinical fields — some require dbGaP approval"
    - "Need realtime clinical-grade test data — CPTAC is retrospective"
  preprocessing_notes:
    - "Use PDC client / API for download; per-cohort manifests required."
    - "Patient-level splits."
    - "Stain normalisation across cohorts."
    - "Verify modality availability per case-id — proteomics and WSI coverage don't always overlap perfectly."
  known_pitfalls:
    - "Small per-cohort sizes."
    - "Multi-scanner drift."
    - "Continuous proteomics labels need binning for classification tasks."
    - "Don't conflate phases — CPTAC phase II / III / IV protocols differ."
  update_level: link_update
  update_status: complete
  extraction_confidence: high
  metadata_confidence: medium                    # exact n_slides / n_patients vary per cohort + snapshot
