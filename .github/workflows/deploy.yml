name: Build and deploy

on:
  push:
    branches: [main]
    paths:
      - "knowledge/**"
      - "content/**"
      - "schemas/**"
      - "scripts/python/**"
      - "skills/**"
      - "mkdocs.yml"
      - "macros.py"
      - "pyproject.toml"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: write   # mkdocs gh-deploy pushes the gh-pages branch

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0          # mkdocs gh-deploy needs git history
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install Python deps
        run: |
          pip install --upgrade pip
          pip install pyyaml jsonschema networkx click \
                      mkdocs mkdocs-material mkdocs-macros-plugin \
                      mkdocs-static-i18n pymdown-extensions
      - name: Validate schemas
        run: python scripts/python/validate_schema.py
      - name: Build graph
        run: python scripts/python/build_graph.py
      - name: Check orphans
        run: python scripts/python/check_orphans.py
      - name: Configure git author for gh-deploy
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Build and deploy site
        run: mkdocs gh-deploy --force --message "Deploy {sha} from CI"
