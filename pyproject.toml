[project]
name = "pathology-wiki-tools"
version = "0.0.1"
description = "Data-side scripts for Pathology-Wiki: validation, graph build, context export."
requires-python = ">=3.10"
dependencies = [
  "pyyaml>=6.0",
  "jsonschema>=4.17",
  "networkx>=3.0",
  "click>=8.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=7",
  "ruff>=0.1",
]

[project.scripts]
pwiki-validate = "scripts.python.validate_schema:main"
pwiki-build-graph = "scripts.python.build_graph:main"
pwiki-export-context = "scripts.python.export_claude_context:main"
pwiki-check-orphans = "scripts.python.check_orphans:main"

[tool.ruff]
line-length = 100

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
