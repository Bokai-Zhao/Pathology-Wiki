[project]
name = "pathology-wiki-tools"
version = "0.1.0"
description = "Data + site tooling for Pathology-Wiki (validation, graph build, MkDocs Material rendering)."
requires-python = ">=3.10"
dependencies = [
  "pyyaml>=6.0",
  "jsonschema>=4.17",
  "networkx>=3.0",
  "click>=8.1",
]

[project.optional-dependencies]
site = [
  "mkdocs>=1.6",
  "mkdocs-material>=9.5",
  "mkdocs-macros-plugin>=1.0",
  "mkdocs-static-i18n>=1.3",
  "pymdown-extensions>=10.7",
]
dev = [
  "pytest>=7",
  "ruff>=0.1",
]

[tool.ruff]
line-length = 100

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
