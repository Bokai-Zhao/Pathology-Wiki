site_name: Pathology-Wiki
site_description: An agent-extensible knowledge base for computational pathology.
site_url: https://bokai-zhao.github.io/Pathology-Wiki/
repo_url: https://github.com/Bokai-Zhao/Pathology-Wiki
repo_name: Bokai-Zhao/Pathology-Wiki
edit_uri: edit/main/content/

docs_dir: content
site_dir: site

theme:
  name: material
  language: en
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - search.highlight
    - search.suggest
    - search.share
    - content.code.copy
    - content.action.edit
    - toc.follow
  palette:
    - scheme: default
      primary: deep purple
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      primary: deep purple
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  icon:
    repo: fontawesome/brands/github

plugins:
  - search
  - macros:
      module_name: macros
      include_dir: content
  - i18n:
      docs_structure: suffix
      fallback_to_default: true
      reconfigure_material: true
      reconfigure_search: true
      languages:
        - locale: en
          name: English
          default: true
          build: true
          site_name: Pathology-Wiki
        - locale: zh
          name: 中文
          link: /zh/
          build: true
          site_name: Pathology-Wiki — 病理 AI 知识库
          nav_translations:
            Home: 首页
            Articles: 论文
            Reviews: 综述
            Technical: 技术
            Models: 模型
            Tools: 工具
            Datasets: 数据集
            Methods: 方法
            Knowledge graph: 知识图谱
            Skills: 技能

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - footnotes
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.snippets

nav:
  - Home: index.md
  - Articles:
      - Reviews:
          - "Bahadir 2024 — AI in histopathology": articles/reviews/bahadir-2024.md
      - Technical:
          - "UNI (2024)": articles/technical/uni-2024.md
          - "ABMIL (Ilse 2018)": articles/technical/abmil-2018.md
          - "CLAM (Lu 2021)": articles/technical/clam-2021.md
          - "TransMIL (Shao 2021)": articles/technical/transmil-2021.md
          - "Campanella 2019 — clinical-grade MIL": articles/technical/campanella-2019.md
          - "HoVer-Net (Graham 2019)": articles/technical/hover-net-2019.md
          - "CellViT (Hörst 2024)": articles/technical/cellvit-2024.md
          - "CTransPath (Wang 2022)": articles/technical/ctranspath-2022.md
          - "CLIP (Radford 2021)": articles/technical/clip-2021.md
          - "PLIP (Huang 2023)": articles/technical/plip-2023.md
          - "MI-Zero (Lu 2023)": articles/technical/mi-zero-2023.md
          - "Prov-GigaPath (Xu 2024)": articles/technical/gigapath-2024.md
          - "CHIEF (Wang 2024)": articles/technical/chief-2024.md
          - "Virchow (Vorontsov 2024)": articles/technical/virchow-2024.md
          - "CONCH (Lu 2024)": articles/technical/conch-2024.md
          - "PathChat (Lu 2024)": articles/technical/pathchat-2024.md
          - "DSMIL (Li 2021)": articles/technical/dsmil-2021.md
          - "TITAN (Ding 2025)": articles/technical/titan-2025.md
          - "PRISM (Shaikovski 2024)": articles/technical/prism-2024.md
          - "MADELEINE (Jaume 2024)": articles/technical/madeleine-2024.md
          - "TANGLE (Jaume 2024)": articles/technical/tangle-2024.md
          - "PORPOISE (Chen 2022)": articles/technical/porpoise-2022.md
          - "DTFD-MIL (Zhang 2022)": articles/technical/dtfd-mil-2022.md
          - "Lunit-DINO (Kang 2022)": articles/technical/lunit-dino-2022.md
          - "Phikon (Filiot 2023)": articles/technical/phikon-2023.md
          - "DT-MIL (Li 2021)": articles/technical/dt-mil-2021.md
          - "MCAT (Chen 2021)": articles/technical/mcat-2021.md
  - Models:
      - UNI: models/uni.md
      - CTransPath: models/ctranspath.md
      - PLIP: models/plip.md
  - Tools:
      - OpenSlide: tools/openslide.md
      - "Awesome-AI4DigitalPathology": tools/awesome-ai4digitalpathology.md
  - Datasets:
      - PANDA: datasets/panda.md
      - Camelyon16: datasets/camelyon16.md
      - BACH: datasets/bach.md
      - GlaS: datasets/glas.md
      - PanNuke: datasets/pannuke.md
      - MIDOG: datasets/midog.md
      - TCGA: datasets/tcga.md
  - Methods:
      - Pathology Foundation Model: methods/pathology-foundation-model.md
      - Patch-Level SSL: methods/patch-level-ssl.md
      - Weakly-Supervised MIL: methods/weakly-supervised-mil.md
      - ABMIL: methods/abmil.md
      - CLAM: methods/clam.md
      - TransMIL: methods/transmil.md
      - HoVer-Net: methods/hover-net.md
      - CellViT: methods/cellvit.md
      - Pathology VLM: methods/pathology-vlm.md
  - Knowledge graph: graph.md
  - Skills: skills.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/Bokai-Zhao/Pathology-Wiki

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - https://unpkg.com/cytoscape@3.30.0/dist/cytoscape.min.js
  - javascripts/local-graph.js
